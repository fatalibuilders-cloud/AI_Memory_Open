[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgscalper"
version = "0.1.0"
description = "Personal Telegram signal copier: reads trade signals from your own Telegram groups and executes them on your broker."
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36,<2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0"]

[project.scripts]
tgscalper = "tgscalper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

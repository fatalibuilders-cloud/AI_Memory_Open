[project]
name = "deriv-crypto-bot"
version = "1.0.0"
description = "A 24/7 cryptocurrency-only trading bot for the Deriv WebSocket API"
requires-python = ">=3.10"
dependencies = ["websockets>=12.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
dotenv = ["python-dotenv>=1.0"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-q"

version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: mitfatali
      POSTGRES_PASSWORD: mitfatali
      POSTGRES_DB: mitfatali_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  backend:
    build: ./apps/backend
    command: npm run dev
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgres://mitfatali:mitfatali@postgres:5432/mitfatali_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
  frontend:
    build: ./apps/frontend
    command: npm run dev
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
volumes:
  pgdata:
